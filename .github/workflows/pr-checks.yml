name: PR Checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build_artifact:
        description: Build and upload unsigned DMG and ZIP packages
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run prototype tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prototype-ci"
          swift test --package-path Prototype \
            --skip IslandBridgeE2ETests \
            --skip SocketServerTests \
            2>&1 | tee "$RUNNER_TEMP/prototype-ci/01-run-tests.log"

      - name: Run Xcode unit tests
        run: >
          xcodebuild
          -project PingIsland.xcodeproj
          -scheme PingIsland
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -resultBundlePath "$RUNNER_TEMP/PingIslandTests.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test
          -only-testing:PingIslandTests

      - name: Build unsigned packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_artifact }}
        run: ./scripts/package-unsigned.sh

      - name: Upload unsigned packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: PingIsland-unsigned-${{ github.sha }}
          path: releases/unsigned/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload prototype diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Prototype-ci-logs
          path: ${{ runner.temp }}/prototype-ci
          if-no-files-found: ignore

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PingIslandTests-xcresult
          path: ${{ runner.temp }}/PingIslandTests.xcresult
          if-no-files-found: ignore
